version: "3.9"
services:
  web:
    build: .
    container_name: starryhealth-web
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:password@db:5432/starryhealth"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: starryhealth-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: starryhealth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
